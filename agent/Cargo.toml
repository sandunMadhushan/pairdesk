[package]
name = "pairdesk-agent"
version = "0.1.0"
edition = "2024"
description = "PairDesk desktop agent: control this computer from your phone"
license = "GPL-3.0-or-later"
repository = "https://github.com/sandunMadhushan/pairdesk"
homepage = "https://pairdesk.madhushan.me"
publish = false

[dependencies]
enigo = "0.6.1"
env_logger = "0.11.11"
futures-util = "0.3.34"
gethostname = "1.1.0"
local-ip-address = "0.6.13"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-tungstenite = "0.30.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
