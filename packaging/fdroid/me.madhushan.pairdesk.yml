# F-Droid build recipe for PairDesk: the file to submit to
# https://gitlab.com/fdroid/fdroiddata as metadata/me.madhushan.pairdesk.yml
# (see docs/STORES.md). The app's listing text, icon and changelogs come
# from fastlane/metadata/android in this repository.
Categories:
  - Connectivity
  - System
License: GPL-3.0-or-later
AuthorName: Sandun Madhushan
AuthorEmail: contact@madhushan.me
WebSite: https://pairdesk.madhushan.me
SourceCode: https://github.com/sandunMadhushan/pairdesk
IssueTracker: https://github.com/sandunMadhushan/pairdesk/issues
Changelog: https://github.com/sandunMadhushan/pairdesk/releases

AutoName: PairDesk

RepoType: git
Repo: https://github.com/sandunMadhushan/pairdesk.git

Builds:
  - versionName: 0.11.0
    versionCode: 1014
    commit: v0.11.0
    subdir: mobile
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.7
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - mobile/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache PAIRDESK_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 0.11.0
    versionCode: 2014
    commit: v0.11.0
    subdir: mobile
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.47.7
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - mobile/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache PAIRDESK_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

  - versionName: 0.11.0
    versionCode: 4014
    commit: v0.11.0
    subdir: mobile
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@3.47.7
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - mobile/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache PAIRDESK_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-x64

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - 1000 + %c
  - 2000 + %c
  - 4000 + %c
UpdateCheckData: mobile/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.11.0
CurrentVersionCode: 4014
