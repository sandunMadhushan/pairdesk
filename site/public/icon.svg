<!-- PairDesk icon: a laptop with a phone in front of it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a74f0"/>
      <stop offset="1" stop-color="#1f4fc4"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- laptop -->
  <rect x="40" y="62" width="150" height="100" rx="12" fill="none" stroke="#fff" stroke-width="14"/>
  <rect x="22" y="178" width="186" height="16" rx="8" fill="#fff"/>
  <!-- phone, in front -->
  <rect x="150" y="102" width="78" height="128" rx="16" fill="#1f4fc4"/>
  <rect x="158" y="110" width="62" height="112" rx="10" fill="#fff"/>
  <rect x="166" y="122" width="46" height="72" rx="4" fill="#3a74f0"/>
  <circle cx="189" cy="208" r="6" fill="#3a74f0"/>
</svg>
