# Builds site/ (Next.js, static export) and publishes it to GitHub Pages
# (pairdesk.madhushan.me).
# One-time setup: Settings → Pages → Source: GitHub Actions; custom domain
# pairdesk.madhushan.me (DNS: CNAME pairdesk → sandunmadhushan.github.io).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages needs a public repository on a free account.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Next.js static export: site/ -> site/out/
      - run: npm ci && npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@v4
