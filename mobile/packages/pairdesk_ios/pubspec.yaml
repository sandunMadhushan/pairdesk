name: pairdesk_ios
description: "PairDesk's iPhone-only native side: files, pairing links, sound and the screen's video."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PairdeskIosPlugin
